<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f3f6fb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183049} .h{font-size:30px;font-weight:600}.t{font-size:21px}.small{font-size:18px;fill:#52667c}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547794"/></marker></defs><text x="48" y="65" class="h">按问题环境读取源码，保留个人开发现场</text><text x="48" y="102" class="small">每次调查独立快照 · 相同环境与分支 · 结论保留版本证据</text><rect x="48" y="142" width="345" height="142" rx="16" fill="#fff" stroke="#c8d5e4"/><text x="72" y="181" class="t">群内提出源码问题</text><text x="72" y="217" class="small">明确 UAT / PRD / 其它已配环境</text><text x="72" y="246" class="small">环境不明：先询问，不猜测分支</text><rect x="448" y="142" width="375" height="142" rx="16" fill="#fff" stroke="#c8d5e4"/><text x="472" y="181" class="t">本机可信项目配置</text><text x="472" y="217" class="small">项目根目录 + 各仓 origin</text><text x="472" y="246" class="small">环境 ID → 每个仓库的固定分支</text><rect x="878" y="142" width="354" height="142" rx="16" fill="#e9f2ff" stroke="#c8d5e4"/><text x="902" y="181" class="t">个人开发目录</text><text x="902" y="217" class="small">功能分支与未提交修改保留</text><text x="902" y="246" class="small">只读获取来源，不切分支</text><path d="M394 213 L443 213" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M877 213 L829 213" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="334" width="345" height="152" rx="16" fill="#eaf7f3" stroke="#c8d5e4"/><text x="72" y="373" class="t">本次 UAT 独立快照</text><text x="72" y="409" class="small">同步 UAT 对应远端分支</text><text x="72" y="438" class="small">新目录 / 已确认 commit</text><text x="72" y="467" class="small">不同任务不会覆盖快照</text><rect x="448" y="334" width="375" height="152" rx="16" fill="#eef0ff" stroke="#c8d5e4"/><text x="472" y="373" class="t">本次 PRD 独立快照</text><text x="472" y="409" class="small">同步 PRD 对应远端分支</text><text x="472" y="438" class="small">分支缺失或同步失败则阻塞</text><text x="472" y="467" class="small">不回退其它环境</text><rect x="878" y="334" width="354" height="152" rx="16" fill="#fff" stroke="#c8d5e4"/><text x="902" y="373" class="t">只读调查 → 负责人汇总</text><text x="902" y="409" class="small">沿用同一快照，不再次拉取</text><text x="902" y="438" class="small">执行前后检查提交和文件</text><text x="902" y="467" class="small">环境 / 分支 / commit 可追溯</text><path d="M532 286 L242 329" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M635 287 L635 329" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M824 411 L872 411" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M221 488 L221 522 L1050 522 L1050 490" stroke="#547794" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="570" width="1184" height="105" rx="16" fill="#fff" stroke="#c8d5e4"/><text x="72" y="609" class="t">结论有明确边界</text><text x="72" y="645" class="small">源码快照能证明分析的是哪个版本；是否已部署到 UAT / PRD，仍需另行验证。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f4f7fb"/><style>text{font-family:"PingFang SC",sans-serif;fill:#183049;font-size:21px}.h{font-size:30px;font-weight:600}.small{font-size:18px;fill:#53677a}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58758f"/></marker></defs><text x="48" y="65" class="h">编辑补 @ 接单与决策冲突修正</text><text x="48" y="105" class="small">新消息实时接收；编辑消息按配置补查；原有管理员审批仍然有效</text><rect x="48" y="150" width="350" height="160" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="68" y="185" class="">编辑后补 @</text><text x="68" y="225" class="small">机器人身份补查已绑定群</text><text x="68" y="252" class="small">首次读取只建基线，不重放</text><text x="68" y="279" class="small">权限不足：记录原因并退避</text><rect x="465" y="150" width="350" height="160" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="485" y="185" class="">原消息接单与去重</text><text x="485" y="225" class="small">真人 + 明确 @ 当前机器人</text><text x="485" y="252" class="small">保留原消息、话题和图片</text><text x="485" y="279" class="small">同消息已受理：不重复执行</text><rect x="882" y="150" width="350" height="160" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="902" y="185" class="">AI 理解当前问题</text><text x="902" y="225" class="small">仅使用本问题上下文</text><text x="902" y="252" class="small">源码与实时查询分阶段</text><text x="902" y="279" class="small">未知目标先询问</text><path d="M400 230L457 230" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><path d="M817 230L874 230" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><path d="M1057 315L1057 385" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="390" width="350" height="160" rx="16" fill="#e9f7ef" stroke="#c8d6e5"/><text x="68" y="425" class="">按原权限执行</text><text x="68" y="465" class="small">合法决策才创建或推进任务</text><text x="68" y="492" class="small">实时 PRD 查询仍需要批准</text><text x="68" y="519" class="small">结果回到本问题卡片</text><rect x="465" y="390" width="350" height="160" rx="16" fill="#fff4df" stroke="#c8d6e5"/><text x="485" y="425" class="">校验修正后的决策</text><text x="485" y="465" class="small">合法：进入原任务流程</text><text x="485" y="492" class="small">仍冲突：报告协议错误</text><text x="485" y="519" class="small">不误报 VPN / 登录故障</text><rect x="882" y="390" width="350" height="160" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="902" y="425" class="">字段冲突时修正一次</text><text x="902" y="465" class="small">同一只读会话追加修正</text><text x="902" y="492" class="small">不先执行、不扩权</text><text x="902" y="519" class="small">传输失败不作为协议重试</text><path d="M879 470L822 470" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><path d="M462 470L405 470" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><text x="48" y="628" class="">补查默认30秒一次、最近60分钟创建的消息；超出范围可新发 @ 消息。</text><text x="48" y="668" class="small">已处理消息的后续编辑不会改写旧任务；修改需求请在卡片下发新追问。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6282a7"/></marker></defs><rect width="1280" height="720" fill="#f3f6fa"/><g font-family="PingFang SC, sans-serif" fill="#20344c"><text x="70" y="78" font-size="34" font-weight="600">AgentOS · Nacos 到数据库自动接续</text><text x="70" y="117" font-size="19" fill="#50627a">你确认目标，程序在本机完成凭据接续；模型只接收脱敏结果。</text><rect x="70" y="174" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="92" y="212" font-size="21" font-weight="600">1  群内提出连接要求</text><text x="92" y="247" font-size="16" fill="#50627a">沿用本问题的项目与环境</text><rect x="480" y="174" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="502" y="212" font-size="21" font-weight="600">2  发现配置来源</text><text x="502" y="247" font-size="16" fill="#50627a">固定 Nacos 配置 + 内容摘要</text><rect x="890" y="174" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="912" y="212" font-size="21" font-weight="600">3  管理员确认</text><text x="912" y="247" font-size="16" fill="#50627a">目标库 · 业务账号模式 · 范围</text><rect x="890" y="342" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="912" y="380" font-size="21" font-weight="600">4  Mac 本机接续</text><text x="912" y="415" font-size="16" fill="#50627a">TLS / 获批例外 → 只读事务</text><rect x="480" y="342" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="502" y="380" font-size="21" font-weight="600">5  验证成功后保存</text><text x="502" y="415" font-size="16" fill="#50627a">凭据进入 Keychain</text><rect x="70" y="342" width="320" height="104" rx="14" fill="white" stroke="#b8c9dd"/><text x="92" y="380" font-size="21" font-weight="600">6  按原身份继续</text><text x="92" y="415" font-size="16" fill="#50627a">受控只读查询自动执行</text><g stroke="#6282a7" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M390 226 H468"/><path d="M800 226 H878"/><path d="M1050 278 V330"/><path d="M890 394 H812"/><path d="M480 394 H402"/></g><rect x="70" y="503" width="1140" height="72" rx="12" fill="#fff0ea"/><text x="94" y="546" font-size="19">不支持 TLS → 原卡明确批准单目标非 TLS → 重试；其他错误停止并报告原因</text><text x="70" y="628" font-size="17" fill="#50627a">密码不发群、不交给模型、不写日志；只保存到本机 Keychain。</text><text x="70" y="660" font-size="17" fill="#50627a">非 TLS 例外仅限已确认目标；失去 TLS 传输保护，账号与查询限制仍保留。</text></g></svg>

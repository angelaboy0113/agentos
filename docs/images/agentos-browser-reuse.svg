<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#f4f7fb"/><style>text{font-family:"PingFang SC",sans-serif;fill:#183049;font-size:21px}.h{font-size:30px;font-weight:600}.small{font-size:18px;fill:#53677a}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58758f"/></marker></defs><text x="48" y="65" class="h">后台浏览器复用与失败证据保留</text><text x="48" y="105" class="small">只读查询批准后运行；首次人工接入才显示本机登录窗口</text><rect x="48" y="154" width="340" height="150" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="70" y="191" class="">打开环境页面</text><text x="70" y="231" class="small">首次打开：后台登录</text><text x="70" y="259" class="small">再次打开：复用已登录页面</text><text x="70" y="287" class="small">刷新控件引用，不重复登录</text><rect x="468" y="154" width="340" height="150" rx="16" fill="#fff" stroke="#c8d6e5"/><text x="490" y="191" class="">按授权范围继续排查</text><text x="490" y="231" class="small">成功：保存本次证据</text><text x="490" y="259" class="small">每步核对权限和有效期</text><text x="490" y="287" class="small">不执行未批准操作</text><rect x="888" y="154" width="340" height="150" rx="16" fill="#e9f7ef" stroke="#c8d6e5"/><text x="910" y="191" class="">达到目标</text><text x="910" y="231" class="small">汇总已验证结论</text><text x="910" y="259" class="small">保留来源与未验证事项</text><text x="910" y="287" class="small">结束本次独立浏览器会话</text><path d="M390 230L460 230" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><path d="M810 230L880 230" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><path d="M637 309L637 373" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="382" width="340" height="150" rx="16" fill="#fff0ed" stroke="#c8d6e5"/><text x="70" y="419" class="">第一步就失败</text><text x="70" y="459" class="small">没有成功证据：任务受阻</text><text x="70" y="487" class="small">显示错误码与具体失败步骤</text><text x="70" y="515" class="small">不假装已经查到结果</text><rect x="468" y="382" width="340" height="150" rx="16" fill="#fff4df" stroke="#c8d6e5"/><text x="490" y="419" class="">排查中途失败</text><text x="490" y="459" class="small">停止操作，不自动重试</text><text x="490" y="487" class="small">保留已成功取得的结果</text><text x="490" y="515" class="small">仅用已有证据生成汇总</text><rect x="888" y="382" width="340" height="150" rx="16" fill="#fff4df" stroke="#c8d6e5"/><text x="910" y="419" class="">展示部分结果</text><text x="910" y="459" class="small">已有发现 + 失败步骤</text><text x="910" y="487" class="small">明确哪些仍未查明</text><text x="910" y="515" class="small">不把部分结果标为完成</text><path d="M810 458L880 458" stroke="#58758f" stroke-width="3" marker-end="url(#a)"/><text x="48" y="614" class="">例如：TIMEOUT · 等待登录表单 / 打开配置列表 / 点击页面控件</text><text x="48" y="655" class="small">群内仅展示固定映射的诊断；账号密码、令牌及原始错误不直接回显。</text></svg>